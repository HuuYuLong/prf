# @package _global_
defaults:
  - /pipeline: pathx
  - /model: snn
  - override /scheduler: cosine_warmup

#scheduler:
#  num_training_steps: 125000 # 50 epochs
#  num_warmup_steps: 1250

scheduler:
  num_training_steps: 1000000 # 50 epochs
  num_warmup_steps: 20000

model:
  dropout: 0.2
  n_layers: 6
  prenorm: true
  d_model: 256
  norm: batch
  layer:
#    d_state: 64
#    lr: 0.001
    dt_min: 0.0001
    dt_max: 0.1
    bidirectional: true
    fr_scale: 1
    train_scale: false
    v_th: 1.
    tau: 2.
    neuron_lr: 0.0001
    spatial: 'Binary'
    temporal: null # 'defual prf'

loader:
  batch_size: 8
  num_workers: 4

optimizer:
  lr: 0.00025
  weight_decay: 0.07

trainer:
  max_epochs: 50 #50
  devices: 1

train:
  seed: 2222
  interval: step # For cosine scheduler
  monitor: test/accuracy
  optimizer_param_grouping:
    normalization_weight_decay: false
    bias_weight_decay: false

dataset:
  tokenize: true
  center: true

encoder: embedding