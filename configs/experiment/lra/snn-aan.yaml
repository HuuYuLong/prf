# @package _global_
defaults:
  - /pipeline: aan
  - /model: snn
  - override /scheduler: cosine_warmup

decoder:
  mode: pool

model:
  dropout: 0.
  n_layers: 6
  prenorm: true
  d_model: 256
  norm: batch
  layer:
    lr:
      dt: null
      A: 0.001
      B: 0.001
    dt_min: 0.001
    dt_max: 0.1
    fr_scale: 8
#    init: legs
    bidirectional: false
#    n_ssm: 1
    train_scale: false
    spatial: 'Binary'


loader:
  batch_size: 32

optimizer:
  lr: 0.005
  weight_decay: 0.05

scheduler:
  num_training_steps: 100000 # 20 epochs
  num_warmup_steps: 5000

trainer:
  max_epochs: 20

train:
  seed: 3333
  interval: step
  monitor: test/accuracy
