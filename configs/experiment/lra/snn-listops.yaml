# @package _global_
defaults:
  - /pipeline: listops
  - /model: snn
  - override /scheduler: cosine_warmup

model:
  dropout: 0.
  n_layers: 8
  d_model: 128
  prenorm: false
  norm: batch
  layer:
#    lr:
#      dt: 0.001
    dt_min: 0.001
    dt_max: 0.1
    bidirectional: false
    fr_scale: 1
    train_scale: false
    spatial: 'Binary'
    temporal: null
    
decoder:
  mode: pool

loader:
  batch_size: 50

optimizer:
  lr: 0.005
  weight_decay: 0.05

#scheduler:
#  num_training_steps: 120000  # 40 epoch
#  num_warmup_steps: 12000

scheduler:
  num_training_steps: 80000
  # patience: 5

trainer:
  max_epochs: 40


train:
  seed: 2222
  monitor: test/accuracy
